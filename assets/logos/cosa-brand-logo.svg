    <path d="M7 78A57 57 0 0 1 62 6" fill="none" stroke="#8056B2" stroke-width="2.2" stroke-linecap="round"/>
    
    <circle cx="62" cy="29" r="9" fill="url(#co-violet)"/>
    <circle cx="31" cy="52" r="8" fill="#8056B2"/>
